[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kpro"
version = "0.1.0"
description = "Local-first C++ competitive programming library and contest tooling"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "competitive-verifier>=3,<4", "zensical>=0.0.20,<0.1", "online-judge-tools-ng>=12,<13"]

[project.scripts]
kpro = "kpro.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["tools/kpro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
